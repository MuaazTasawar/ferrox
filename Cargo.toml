[workspace]
resolver = "2"
members = [
    "crates/ferrox-cli",
    "crates/ferrox-macros",
    "crates/ferrox-strings",
    "crates/ferrox-keygen",
    "crates/ferrox-runtime",
    "crates/ferrox-mir-pass",
    "crates/ferrox-vm",
    "crates/ferrox-redteam",
    "examples/license-checker",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/MuaazTasawar/ferrox"
authors = ["Muaaz Tasawar"]

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
cargo_metadata = "0.18"
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
once_cell = "1.19"
rand = "0.8"
thiserror = "1.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
