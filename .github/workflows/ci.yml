name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  stable-build:
    name: Build & Test (stable, non-nightly crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --exclude ferrox-mir-pass -- -D warnings

      - name: Build (excluding nightly-only MIR pass crate)
        run: cargo build --workspace --exclude ferrox-mir-pass --verbose

      - name: Test (excluding nightly-only MIR pass crate)
        run: cargo test --workspace --exclude ferrox-mir-pass --verbose

  nightly-mir-pass:
    name: Build & Test (pinned nightly, ferrox-mir-pass)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned toolchain
        id: toolchain
        run: |
          CHANNEL=$(grep '^channel' rust-toolchain.toml | cut -d'"' -f2)
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

      - name: Install pinned nightly toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustc-dev, llvm-tools-preview, rust-src, clippy, rustfmt

      - name: Verify pinned toolchain resolved (fail fast, F2.6)
        run: |
          rustc --version
          if ! rustc --version | grep -q "nightly"; then
            echo "::error::Pinned nightly toolchain did not resolve correctly."
            exit 1
          fi

      - name: Build ferrox-mir-pass
        run: cargo build -p ferrox-mir-pass --verbose

      - name: Test ferrox-mir-pass
        run: cargo test -p ferrox-mir-pass --verbose

  integration:
    name: Integration -- license-checker example
    runs-on: ubuntu-latest
    needs: [stable-build]
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build license-checker example
        run: cargo build -p license-checker --release --verbose

      - name: Functional check -- correct key is accepted
        run: |
          OUTPUT=$(./target/release/license-checker "FERROX-DEMO-1234-5678")
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "License valid"

      - name: Functional check -- wrong key is rejected
        run: |
          OUTPUT=$(./target/release/license-checker "wrong-key")
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "Invalid license key"

      - name: F1.2 -- encrypted literals must not appear in `strings` output
        run: |
          if strings target/release/license-checker | grep -F "FERROX-DEMO-1234-5678"; then
            echo "::error::Plaintext license key found via strings -- Layer 1 encryption is not working."
            exit 1
          fi
          if strings target/release/license-checker | grep -F "License valid -- thank you"; then
            echo "::error::Plaintext success message found via strings -- Layer 1 encryption is not working."
            exit 1
          fi
          if strings target/release/license-checker | grep -F "Invalid license key."; then
            echo "::error::Plaintext rejection message found via strings -- Layer 1 encryption is not working."
            exit 1
          fi
          echo "F1.2 check passed: no enc!()-protected literal found in strings output."
